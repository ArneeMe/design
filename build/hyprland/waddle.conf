$bg = rgb(0c0e10)
$surface = rgb(15181b)
$border = rgb(2d3237)
$text = rgb(e2e5e8)
$muted = rgb(969ca2)
$accent = rgb(5fb0dc)

general {
    border_size = 2
    gaps_in = 4
    gaps_out = 8
    col.active_border = $accent
    col.inactive_border = $border
}

decoration {
    rounding = 0
    shadow {
        enabled = false
    }
    blur {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = isbre, 0.2, 0, 0, 1
    animation = windows, 1, 2, isbre, slide
    animation = border, 1, 1.2, isbre
    animation = fade, 1, 1.2, isbre
    animation = workspaces, 1, 2, isbre, slide
}

misc {
    background_color = $bg
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

group {
    col.border_active = $accent
    col.border_inactive = $border
}

$bg = rgb(0e0e0d)
$surface = rgb(171716)
$border = rgb(2f2f2c)
$text = rgb(e4e4df)
$muted = rgb(9a9a94)
$accent = rgb(f0a040)

general {
    border_size = 2
    gaps_in = 4
    gaps_out = 8
    col.active_border = $accent
    col.inactive_border = $border
}

decoration {
    rounding = 0
    shadow {
        enabled = false
    }
    blur {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = waddle, 0.2, 0, 0, 1
    animation = windows, 1, 2, waddle, slide
    animation = border, 1, 1.2, waddle
    animation = fade, 1, 1.2, waddle
    animation = workspaces, 1, 2, waddle, slide
}

misc {
    background_color = $bg
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

group {
    col.border_active = $accent
    col.border_inactive = $border
}
